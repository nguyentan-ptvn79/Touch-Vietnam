{% extends "base.html" %}
{% block content %}
<section class="auth-shell">
    <article class="auth-card">
        <span class="eyebrow">{{ t('register_eyebrow') }}</span>
        <h1>{{ t('register_title') }}</h1>

        <form method="post" class="auth-form">
            <div class="form-field">
                <label for="full_name">{{ t('form_full_name') }}</label>
                <input id="full_name" name="full_name" required>
            </div>
            <div class="form-field">
                <label for="email">{{ t('form_email') }}</label>
                <input id="email" name="email" type="email" required>
            </div>
            <div class="form-field">
                <label for="password">{{ t('form_password') }}</label>
                <input id="password" name="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required>
            </div>
            <button class="button primary" type="submit">{{ t('register_submit') }}</button>
        </form>

        <p>{{ t('register_has_account') }} <a href="{{ url_for('login') }}">{{ t('register_login_link') }}</a></p>
    </article>
</section>
{% endblock %}
