<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <style>
      .title{font:700 36px 'Segoe UI',Arial,sans-serif;fill:#15384c}.h{font:700 23px 'Segoe UI',Arial,sans-serif;fill:#15384c}
      .t{font:500 18px 'Segoe UI',Arial,sans-serif;fill:#294753}.line{stroke:#547069;stroke-width:2.5;fill:none}
    </style>
  </defs>
  <rect width="1600" height="1050" fill="#fff"/>
  <text x="800" y="55" text-anchor="middle" class="title">SƠ ĐỒ USE CASE TỔNG QUÁT</text>
  <rect x="310" y="100" width="1010" height="875" rx="20" fill="#fbfdfc" stroke="#006b3f" stroke-width="4"/>
  <text x="815" y="142" text-anchor="middle" class="h">Hệ thống Touch VN</text>

  <g class="line"><circle cx="135" cy="275" r="28"/><path d="M135 303 V400 M85 340 H185 M135 400 L85 465 M135 400 L185 465"/></g>
  <text x="135" y="500" text-anchor="middle" class="h">Khách du lịch</text>
  <g class="line"><circle cx="1465" cy="330" r="28"/><path d="M1465 358 V455 M1415 395 H1515 M1465 455 L1415 520 M1465 455 L1515 520"/></g>
  <text x="1465" y="555" text-anchor="middle" class="h">Quản trị viên</text>

  <g fill="#edf8fb" stroke="#3397bd" stroke-width="2.5">
    <ellipse cx="535" cy="230" rx="165" ry="49"/><ellipse cx="535" cy="360" rx="165" ry="49"/>
    <ellipse cx="535" cy="490" rx="165" ry="49"/><ellipse cx="535" cy="620" rx="165" ry="49"/>
    <ellipse cx="535" cy="750" rx="165" ry="49"/><ellipse cx="535" cy="880" rx="165" ry="49"/>
  </g>
  <text x="535" y="237" text-anchor="middle" class="t">Đăng ký / đăng nhập</text>
  <text x="535" y="355" text-anchor="middle" class="t"><tspan x="535">Khám phá, tìm kiếm và lọc</tspan><tspan x="535" dy="24">địa điểm du lịch</tspan></text>
  <text x="535" y="485" text-anchor="middle" class="t"><tspan x="535">Xem bản đồ, thời tiết,</tspan><tspan x="535" dy="24">nearby, AR và offline</tspan></text>
  <text x="535" y="615" text-anchor="middle" class="t"><tspan x="535">Tìm vé và giữ chỗ</tspan><tspan x="535" dy="24">di chuyển / vui chơi</tspan></text>
  <text x="535" y="745" text-anchor="middle" class="t"><tspan x="535">Lập kế hoạch AI và</tspan><tspan x="535" dy="24">dự toán ngân sách</tspan></text>
  <text x="535" y="875" text-anchor="middle" class="t"><tspan x="535">Quản lý chi tiêu nhóm</tspan><tspan x="535" dy="24">và trò chuyện với AI</tspan></text>

  <g fill="#eef8ed" stroke="#48a45e" stroke-width="2.5">
    <ellipse cx="1050" cy="245" rx="170" ry="49"/><ellipse cx="1050" cy="395" rx="170" ry="49"/>
    <ellipse cx="1050" cy="545" rx="170" ry="49"/><ellipse cx="1050" cy="695" rx="170" ry="49"/>
    <ellipse cx="1050" cy="845" rx="170" ry="49"/>
  </g>
  <text x="1050" y="240" text-anchor="middle" class="t"><tspan x="1050">Quản lý địa điểm, hình ảnh</tspan><tspan x="1050" dy="24">và trạng thái hiển thị</tspan></text>
  <text x="1050" y="390" text-anchor="middle" class="t"><tspan x="1050">Quản lý nội dung website</tspan><tspan x="1050" dy="24">và đề xuất nâng cao</tspan></text>
  <text x="1050" y="540" text-anchor="middle" class="t"><tspan x="1050">Theo dõi lượt truy cập,</tspan><tspan x="1050" dy="24">hiệu năng và xuất CSV</tspan></text>
  <text x="1050" y="690" text-anchor="middle" class="t"><tspan x="1050">Cấu hình dashboard</tspan><tspan x="1050" dy="24">và trạng thái tích hợp</tspan></text>
  <text x="1050" y="840" text-anchor="middle" class="t"><tspan x="1050">Kiểm tra các cổng API</tspan><tspan x="1050" dy="24">và dữ liệu dự phòng</tspan></text>

  <g class="line">
    <path d="M185 340 L370 230"/><path d="M185 350 L370 360"/><path d="M185 360 L370 490"/>
    <path d="M185 370 L370 620"/><path d="M185 380 L370 750"/><path d="M185 390 L370 880"/>
    <path d="M1415 395 L1220 245"/><path d="M1415 405 L1220 395"/><path d="M1415 415 L1220 545"/>
    <path d="M1415 425 L1220 695"/><path d="M1415 435 L1220 845"/>
    <path d="M700 750 C780 750 790 615 880 615" stroke-dasharray="9 7"/>
  </g>
  <text x="790" y="690" text-anchor="middle" class="t">«include» lưu chuyến đi</text>
</svg>
