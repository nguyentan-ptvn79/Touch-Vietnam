<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#31544c"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#173b35" flood-opacity="0.15"/>
    </filter>
    <style>
      .title{font:700 36px 'Segoe UI',Arial,sans-serif;fill:#15384c}.sub{font:500 19px 'Segoe UI',Arial,sans-serif;fill:#526b79}
      .h{font:700 24px 'Segoe UI',Arial,sans-serif;fill:#15384c}.t{font:500 19px 'Segoe UI',Arial,sans-serif;fill:#294753}
      .small{font:500 17px 'Segoe UI',Arial,sans-serif;fill:#365863}.line{stroke:#31544c;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="980" fill="#ffffff"/>
